name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "build.yaml"
      - ".github/workflows/**"

jobs:
  build:
    # Must match the ZMK revision pinned in config/west.yml. The @main harness
    # runs a "Missing ZMK Compat" check using `west boards --format {qualifiers}`,
    # which only exists in Zephyr >=4.1 (hardware-model-v2); against v0.3.0's
    # Zephyr 3.5.0 it dies with KeyError: 'qualifiers' and fails the job even
    # though the firmware itself builds fine.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      amend_commit: false
      install_branch: "main"
      keymap_patterns: "config/*.keymap"
      json_path: "config"
      config_path: "keymap_drawer.config.yaml" # config file, ignored if not exists
      output_folder: "keymap-drawer"
      destination: "both"
      parse_args: ""  # map of extra args to pass to `keymap parse`, e.g. "corne:'-l Def Lwr Rse' cradio:''"
      draw_args: ""   # map of extra args to pass to `keymap draw`, e.g. "corne:'-k corne_rotated' cradio:'-k paroxysm'"

