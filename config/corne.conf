# Required for RGB underglow. At the pinned ZMK v0.3.0 (Zephyr v3.5.0+zmk-fixes)
# this is a real menuconfig symbol and the driver is NOT auto-selected: without
# it rgb_underglow.c fails to link (undefined __device_dts_ord_*). On ZMK main
# Zephyr had split it into WS2812_STRIP_SPI/_I2S/_GPIO and this name is invalid,
# so it must be removed again if the pin is ever moved to main.
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=80

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3


#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
# go to deep sleep after 30 minutes idle (30*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_SLEEP=y

# Add mouse support
CONFIG_ZMK_POINTING=y

# Report battery level of both sides
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# 增加键盘的 BLE 无线电的发射功率，用解决延迟和左右通讯不佳的问题
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLE link stability. ZMK's opt-in bundle of connection settings that upstream
# plans to make default ("experimental" is the naming, not a warning). At the
# pinned v0.3.0 its concrete effect is flipping BT_CTLR_PHY_2M to n
# (zmk/app/Kconfig:185), forcing the more robust 1Mbps PHY. The 2M PHY is
# faster but far less tolerant of interference, which is the first thing to
# fail on Realtek/Intel combo Wi-Fi+BT chips that time-slice one antenna.
# Added 2026-09-09 for intermittent freezes with a stuck repeating key on the
# personal laptop only (dropped link: the release event never arrives, so the
# host auto-repeats until the 4s supervision timeout expires).
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
